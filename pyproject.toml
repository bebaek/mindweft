[project]
name = "minigent"
version = "0.1.0"
description = "Minimal AI agent runtime POC"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "opentelemetry-api>=1.33,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.33,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.54b0,<1.0",
  "opentelemetry-instrumentation-httpx>=0.54b0,<1.0",
  "opentelemetry-sdk>=1.33,<2.0",
  "prompt-toolkit>=3.0.52,<4.0",
  "pyjwt[crypto]>=2.10,<3.0",
  "python-dotenv>=1.0,<2.0",
  "uvicorn>=0.30,<1.0",
]

[project.scripts]
minigent = "app.cli:main"
minigent-client = "minigent_client.cli:main"

[project.optional-dependencies]
minirag = [
  "minirag",
]
voice = [
  "faster-whisper>=1.1,<2.0",
  "numpy>=2,<3",
  "piper-tts>=1.4,<2.0",
  "pvporcupine>=3.0,<4.0",
  "pyopen-wakeword>=1.1.0,<2.0",
  "silero-vad>=6.2.1,<7.0",
  "sounddevice>=0.5.5,<0.6",
]

[dependency-groups]
dev = [
  "basedpyright>=1.20.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.11,<1.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "minigent_client*"]

[tool.setuptools.package-data]
app = ["static/web/*"]

[tool.uv.sources]
minirag = { path = "../minirag" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "B",
  "I",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/admin_api.py" = ["B008"]
"app/auth.py" = ["B008"]
"app/main.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.basedpyright]
include = ["app", "minigent_client"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
