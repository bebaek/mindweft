[project]
name = "mindweft"
version = "0.1.0"
description = "Local-first AI agent runtime with HTTP, CLI, MCP, and coding-workspace interfaces"
readme = { file = "README.md", content-type = "text/markdown" }
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["ai", "agents", "fastapi", "llm", "mcp"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "cryptography>=50.0.0,<51",
  "fastapi>=0.141.1,<1.0",
  "httpx>=0.28,<1.0",
  "httpx2>=2.10.0,<3",
  "mcp>=2,<3",
  "opentelemetry-api>=1.44.0,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.33,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.54b0,<1.0",
  "opentelemetry-instrumentation-httpx>=0.54b0,<1.0",
  "opentelemetry-sdk>=1.33,<2.0",
  "prompt-toolkit>=3.0.53,<4.0",
  "pyjwt[crypto]>=2.13.0,<3.0",
  "pypdf>=6,<7",
  "python-dotenv>=1.0,<2.0",
  "uvicorn>=0.52.3,<1.0",
]

[project.urls]
Repository = "https://github.com/bebaek/mindweft"
Issues = "https://github.com/bebaek/mindweft/issues"

[project.scripts]
mindweft = "mindweft_client.application:main"
mindweft-coding-workspace = "mindweft_workspace.application:main"
mindweft-mcp-stdio-bridge = "mindweft_workspace.bridge.stdio:main"
mindweft-mcp-stdio-gateway = "mindweft_workspace.bridge.gateway:main"
mindweft-shell-mcp = "mindweft_workspace.servers.shell:main"
mindweft-text-mcp = "mindweft_workspace.servers.text:main"
mindweft-client = "mindweft_client.cli:main"
minigent = "minigent_client.application:main"
minigent-coding-workspace = "minigent_workspace.application:main"
minigent-mcp-stdio-bridge = "minigent_workspace.bridge.stdio:main"
minigent-mcp-stdio-gateway = "minigent_workspace.bridge.gateway:main"
minigent-shell-mcp = "minigent_workspace.servers.shell:main"
minigent-text-mcp = "minigent_workspace.servers.text:main"
minigent-client = "minigent_client.cli:main"

[project.optional-dependencies]
voice = [
  "faster-whisper>=1.1,<2.0",
  "numpy>=2.4.6,<3",
  "piper-tts>=1.6.1,<2.0",
  "pvporcupine>=3.0,<5.0",
  "pyopen-wakeword>=1.1.0,<2.0",
  "silero-vad>=6.2.1,<7.0",
  "sounddevice>=0.5.5,<0.6",
]

[dependency-groups]
dev = [
  "basedpyright>=1.39.10",
  "pytest>=8.0,<10.0",
  "ruff>=0.16.3,<1.0",
]

[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
  "app*",
  "mindweft_archive*",
  "mindweft_client*",
  "mindweft_config*",
  "mindweft_mcp*",
  "mindweft_workspace*",
  "minigent_client*",
  "minigent_config*",
  "minigent_mcp*",
  "minigent_workspace*",
]

[tool.setuptools.package-data]
app = ["static/web/*", "static/console/*", "static/console/assets/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "B",
  "I",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/admin_api.py" = ["B008"]
"app/auth.py" = ["B008"]
"app/main.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.basedpyright]
include = [
  "app",
  "mindweft_archive",
  "mindweft_client",
  "mindweft_config",
  "mindweft_mcp",
  "mindweft_workspace",
  "minigent_client",
  "minigent_config",
  "minigent_mcp",
  "minigent_workspace",
]
typeCheckingMode = "standard"
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: opt-in tests that start local services or call external CLIs",
  "e2e: end-to-end tests that start a live Mindweft server",
]
