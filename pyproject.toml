[project]
name = "minigent"
version = "0.1.0"
description = "Minimal AI agent runtime POC"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43,<50",
  "fastapi>=0.141.1,<1.0",
  "httpx>=0.28,<1.0",
  "httpx2>=2.9,<3",
  "mcp>=2,<3",
  "opentelemetry-api>=1.44.0,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.33,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.54b0,<1.0",
  "opentelemetry-instrumentation-httpx>=0.54b0,<1.0",
  "opentelemetry-sdk>=1.33,<2.0",
  "prompt-toolkit>=3.0.53,<4.0",
  "pyjwt[crypto]>=2.13.0,<3.0",
  "python-dotenv>=1.0,<2.0",
  "uvicorn>=0.52.1,<1.0",
]

[project.scripts]
minigent = "minigent_client.one_shot_cli:main"
minigent-coding-workspace = "app.coding_workspace_runner:main"
minigent-mcp-stdio-bridge = "app.mcp_stdio_bridge:main"
minigent-mcp-stdio-gateway = "app.mcp_stdio_gateway:main"
minigent-shell-mcp = "app.shell_mcp_server:main"
minigent-text-mcp = "app.text_mcp_server:main"
minigent-client = "minigent_client.cli:main"

[project.optional-dependencies]
voice = [
  "faster-whisper>=1.1,<2.0",
  "numpy>=2.4.6,<3",
  "piper-tts>=1.6.0,<2.0",
  "pvporcupine>=3.0,<5.0",
  "pyopen-wakeword>=1.1.0,<2.0",
  "silero-vad>=6.2.1,<7.0",
  "sounddevice>=0.5.5,<0.6",
]

[dependency-groups]
dev = [
  "basedpyright>=1.39.9",
  "pytest>=8.0,<10.0",
  "ruff>=0.16.2,<1.0",
]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "minigent_client*"]

[tool.setuptools.package-data]
app = ["static/web/*", "static/console/*", "static/console/assets/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "B",
  "I",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/admin_api.py" = ["B008"]
"app/auth.py" = ["B008"]
"app/main.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.basedpyright]
include = ["app", "minigent_client"]
typeCheckingMode = "standard"
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: opt-in tests that start local services or call external CLIs",
  "e2e: end-to-end tests that start a live Minigent server",
]
