[project]
name = "minigent"
version = "0.1.0"
description = "Minimal AI agent runtime POC"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "opentelemetry-api>=1.33,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.33,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.54b0,<1.0",
  "opentelemetry-instrumentation-httpx>=0.54b0,<1.0",
  "opentelemetry-sdk>=1.33,<2.0",
  "python-dotenv>=1.0,<2.0",
  "uvicorn>=0.30,<1.0",
]

[dependency-groups]
dev = [
  "pyright>=1.1.0,<2.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.11,<1.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "B",
  "I",
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
include = ["app"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
