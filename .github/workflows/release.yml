name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify release tag
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(
            python -c \
              'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          )"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_NAME" != "v${package_version}" ]]; then
            printf 'Release tag %s does not match package version %s.\n' \
              "$GITHUB_REF_NAME" "$package_version" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            printf 'Release tag %s does not point to a commit on origin/main.\n' \
              "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          printf 'Validated Mindweft %s from tag v%s.\n' "$package_version" "$tag_version"
      - name: Build source and wheel distributions
        run: uv build --out-dir dist
      - name: Validate distribution contents and metadata
        run: |
          version="$(
            python -c \
              'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          )"
          python scripts/verify_distribution_artifacts.py dist --version "$version"
      - name: Install and smoke-test wheel in isolation
        shell: bash
        run: |
          set -euo pipefail
          version="$(
            python -c \
              'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          )"
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT
          uv venv "$smoke_dir/venv"
          uv pip install --python "$smoke_dir/venv/bin/python" dist/mindweft-*.whl
          (
            cd "$smoke_dir"
            "$smoke_dir/venv/bin/python" \
              "$GITHUB_WORKSPACE/scripts/smoke_test_installed_distribution.py" \
              --version "$version"
          )
      - name: Upload validated distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish distributions to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/mindweft
    permissions:
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
