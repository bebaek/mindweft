name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type check, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Node.js for static-file tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: uv sync --locked --dev --extra voice
      - name: Check lockfile
        run: uv lock --check
      - name: Run Ruff lint
        run: uv run --no-sync ruff check .
      - name: Check Ruff formatting
        run: uv run --no-sync ruff format --check .
      - name: Run basedpyright
        run: uv run --no-sync basedpyright
      - name: Build frontend for static-file tests
        working-directory: web
        run: npm ci && npm run build
      - name: Stage frontend for Python static-file tests
        run: cp -R web/dist app/static/console
      - name: Run tests
        run: uv run --no-sync pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Run ESLint
        working-directory: web
        run: npm run lint
      - name: Run tests
        working-directory: web
        run: npm test
      - name: Build frontend
        working-directory: web
        run: npm run build

  production-image:
    name: Build and publish production image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [quality, frontend]
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/minigent-app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build production image for smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: minigent-production-smoke:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=minigent
          cache-to: type=gha,mode=max,scope=minigent
      - name: Smoke-test production container
        env:
          SMOKE_IMAGE: minigent-production-smoke:${{ github.sha }}
        run: |
          set -euo pipefail
          container="minigent-production-smoke"
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name "$container" --publish 127.0.0.1::8000 "$SMOKE_IMAGE"
          port="$(docker port "$container" 8000/tcp | awk -F: '{print $NF}')"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "http://127.0.0.1:${port}/health"; then
              printf '\nProduction container passed its health smoke test.\n'
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' "$container" | grep --quiet true; then
              printf 'Production container exited before becoming healthy.\n' >&2
              docker logs "$container" >&2
              exit 1
            fi
            sleep 1
          done

          printf 'Production container did not become healthy within 30 seconds.\n' >&2
          docker logs "$container" >&2
          exit 1
      - name: Publish smoke-tested production image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SMOKE_IMAGE: minigent-production-smoke:${{ github.sha }}
        run: |
          set -euo pipefail
          commit_image="${IMAGE_NAME}:${GITHUB_SHA}"
          main_image="${IMAGE_NAME}:main"
          docker tag "$SMOKE_IMAGE" "$commit_image"
          docker tag "$SMOKE_IMAGE" "$main_image"
          docker push "$commit_image"
          docker push "$main_image"
