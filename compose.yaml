services:
  # Keep the legacy service name so upgrades preserve Compose DNS and operator commands.
  minigent:
    image: ${MINDWEFT_IMAGE:-${MINIGENT_IMAGE:-mindweft:latest}}
    build:
      context: .
    restart: unless-stopped
    env_file:
      - ${MINDWEFT_ENV_FILE:-${MINIGENT_ENV_FILE:-.env}}
    environment:
      MINDWEFT_LOG_FORMAT: json
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Preserve the legacy volume name so existing deployment data is reused.
      - minigent-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  minigent-data:
