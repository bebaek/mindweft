services:
  minigent:
    image: ${MINIGENT_IMAGE:-minigent:latest}
    build:
      context: .
    restart: unless-stopped
    env_file:
      - ${MINIGENT_ENV_FILE:-.env}
    environment:
      MINIGENT_LOG_FORMAT: json
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
