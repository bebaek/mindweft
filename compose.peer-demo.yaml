services:
  # Keep the legacy service name for Compose command and DNS compatibility.
  minigent:
    build:
      context: .
    environment:
      MINDWEFT_LLM_PROVIDER: mock
      MINDWEFT_AUTH_MODE: dev-headers
      MINDWEFT_ENABLE_PEER_AGENT_TOOL: "true"
      MINDWEFT_PEER_AGENTS: '[{"name":"opencode","base_url":"http://local-agent-wrapper:8010","description":"Local OpenCode wrapper sidecar","capabilities":["repository analysis","codebase inspection","read-only command execution in the mounted workspace"],"side_effects":["runs OpenCode CLI commands inside the wrapper container"],"version":"0.1.0"}]'
    ports:
      - "127.0.0.1:${MINDWEFT_PORT:-${MINIGENT_PORT:-8000}}:8000"
    depends_on:
      local-agent-wrapper:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  local-agent-wrapper:
    build:
      context: ./local-agent-wrapper
    environment:
      AGENT_RUNTIME: opencode
      AGENT_ALLOWED_WORKSPACES: /workspace/mindweft
      AGENT_COMMAND: opencode
      AGENT_ARGS_TEMPLATE: run --format json --model ${OPENCODE_MODEL:-openai/gpt-5.2} --dir {cwd} {prompt}
    expose:
      - "8010"
    volumes:
      - .:/workspace/mindweft:ro
      - ./.opencode-container/data:/home/agent/.local/share/opencode
      - ./.opencode-container/config:/home/agent/.config/opencode
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
