<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Minigent Web Client</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Minigent</h1>
          <p id="status">Ready</p>
        </div>
        <div class="actions">
          <button id="settings-button" type="button" aria-controls="settings-panel">
            Settings
          </button>
          <button id="new-thread-button" type="button">New</button>
        </div>
      </header>

      <section id="settings-panel" class="settings" aria-label="Connection settings">
        <label>
          Base URL
          <input id="base-url" type="url" autocomplete="url" />
        </label>
        <label>
          API token
          <input id="api-token" type="password" autocomplete="off" />
        </label>
        <div class="grid">
          <label>
            User ID
            <input id="user-id" type="text" autocomplete="off" />
          </label>
          <label>
            Tenant ID
            <input id="tenant-id" type="text" autocomplete="off" />
          </label>
        </div>
        <label>
          Skill
          <input id="skill" type="text" autocomplete="off" placeholder="optional" />
        </label>
        <label>
          Capability profile
          <input id="capability-profile" type="text" autocomplete="off" placeholder="optional" />
        </label>
      </section>

      <section id="messages" class="messages" aria-live="polite"></section>

      <button id="activity-button" class="run-status" type="button" hidden>
        <span id="run-status-label">Ready</span>
        <span id="run-status-hint" class="run-status-hint">Activity</span>
      </button>

      <form id="composer" class="composer">
        <textarea
          id="message-input"
          rows="1"
          placeholder="Message Minigent"
          autocomplete="off"
        ></textarea>
        <div class="composer-actions">
          <button id="send-button" type="submit">Send</button>
          <button id="stop-button" class="stop-button" type="button" hidden>Stop</button>
        </div>
      </form>
    </main>

    <div id="activity-backdrop" class="activity-backdrop" hidden></div>
    <aside
      id="activity-sheet"
      class="activity-sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="activity-title"
      hidden
    >
      <header class="activity-header">
        <div>
          <h2 id="activity-title">Run activity</h2>
          <p id="activity-summary">No activity yet</p>
        </div>
        <button id="activity-close" type="button" aria-label="Close activity">Close</button>
      </header>
      <ol id="activity-list" class="activity-list"></ol>
    </aside>

    <script src="./app.js"></script>
  </body>
</html>
