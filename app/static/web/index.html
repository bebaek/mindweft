<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minigent Web Client</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Minigent</h1>
          <p id="status">Ready</p>
        </div>
        <div class="actions">
          <button id="settings-button" type="button" aria-controls="settings-panel">
            Settings
          </button>
          <button id="new-thread-button" type="button">New</button>
        </div>
      </header>

      <section id="settings-panel" class="settings" aria-label="Connection settings">
        <label>
          Base URL
          <input id="base-url" type="url" autocomplete="url" />
        </label>
        <label>
          API token
          <input id="api-token" type="password" autocomplete="off" />
        </label>
        <div class="grid">
          <label>
            User ID
            <input id="user-id" type="text" autocomplete="off" />
          </label>
          <label>
            Tenant ID
            <input id="tenant-id" type="text" autocomplete="off" />
          </label>
        </div>
        <label>
          Skill
          <input id="skill" type="text" autocomplete="off" placeholder="optional" />
        </label>
        <label>
          Capability profile
          <input id="capability-profile" type="text" autocomplete="off" placeholder="optional" />
        </label>
      </section>

      <section id="messages" class="messages" aria-live="polite"></section>

      <form id="composer" class="composer">
        <textarea
          id="message-input"
          rows="1"
          placeholder="Message Minigent"
          autocomplete="off"
        ></textarea>
        <button id="send-button" type="submit">Send</button>
      </form>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
